<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listings | Urban Nest</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <nav class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><i class="fas fa-building"></i> URBAN<span>NEST</span></a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="listings.html" class="active">Listings</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <h1>Property Listings</h1>
      <p>Browse our exclusive collection of homes.</p>
    </div>
  </section>

  <section class="listings-section">
    <div class="container">
      <!-- Filter Bar -->
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Search by location or title...">
        
        <select id="filterType">
          <option value="all">All Types</option>
          <option value="House">House</option>
          <option value="Apartment">Apartment</option>
          <option value="Villa">Villa</option>
        </select>

        <select id="sortPrice">
          <option value="default">Sort by Price</option>
          <option value="low">Low to High</option>
          <option value="high">High to Low</option>
        </select>
      </div>

      <div class="properties-grid" id="listingsGrid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border:none; padding-top: 0;">© 2026 Urban Nest. All rights reserved.</div>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
